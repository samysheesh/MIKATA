name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ruff + pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux : environnement des sessions cloud. Windows : plateforme cible
        # (vérifie aussi l'installation des dépendances marquées sys_platform == 'win32').
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Phase 8 : bibliothèques système de Qt (PySide6), pour les tests de l'interface
      # hors écran (QT_QPA_PLATFORM=offscreen). Inutile sous Windows.
      - name: Bibliothèques de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libgl1 libdbus-1-3

      - name: Installer Python 3.11 et les dépendances (uv.lock)
        run: uv sync --locked

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  secrets:
    # Phase 8 (publication) : aucun secret dans le dépôt, historique compris. Binaire
    # gitleaks officiel, version et empreinte figées. Une fausse clé de test se marque
    # « # gitleaks:allow » sur sa ligne.
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Chercher des secrets (historique et fichiers)
        run: |
          ./gitleaks git . --redact --no-banner --exit-code 1
          ./gitleaks dir . --redact --no-banner --exit-code 1
