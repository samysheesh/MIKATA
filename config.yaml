# Configuration de MIKATA (docs/ARCHITECTURE.md §10).
# Les chemins relatifs sont résolus depuis le dossier de ce fichier.
# Les secrets (LLM_API_KEY, SEARCH_API_KEY) vont dans .env, jamais ici.
audio:
  input_device: "NT-USB"           # sous-chaîne du nom, voir scripts/list_audio_devices.py
  output_device: "default"         # "default" = sortie par défaut de Windows
  pre_roll_s: 2.0
  input_channel: null              # 1, 2... = canal du micro ; null = moyenne des canaux
  earcon_volume: 0.5               # volume des sons d'interface (0 à 1)
wake:
  model: models/hey_jarvis.onnx    # -> models/mikata.onnx en phase 7
  verifier: null                   # -> models/mikata_verifier.pkl
  threshold: 0.5                   # fixé ensuite par eval_wakeword.py
  consecutive_frames: 1
  refractory_s: 1.0
  hotkey: "<ctrl>+<alt>+m"
  verifier_threshold: 0.5          # vérificateur : probabilité « ta voix » minimale (eval_wakeword.py)
  collect_negatives: false         # true : enregistre data/negatives/ par extraits de 10 s
  negatives_max_hours: 12          # ... et s'arrête après N heures de collecte (~115 Mo / h)
  log_days: 7                      # purge (corbeille) de data/wake_logs/ après N jours
vad:
  end_silence_ms: 500
  speculative_ms: 250
  max_utterance_s: 15
  no_speech_timeout_s: 4
  model: models/silero_vad.onnx    # scripts/download_models.py
  threshold: 0.5                   # probabilité de voix (0 à 1)
stt:
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16
  beam_size: 1
  # Vocabulaire donné à Whisper (noms propres, mots de MIKATA), puis amorces de suites
  # courtes (« et à Tokyo ? » lu « Yeah, Tokyo » sans elles) ; voir eval_stt.py --prompt.
  # Langue forcée à « fr » dans le code : jamais de détection automatique.
  initial_prompt: "MIKATA, Bloc-notes, Spotify, Discord, Steam, Chrome, VS Code, PowerShell. Et à Tokyo ? Et demain ?"
  prompt_apps: true                # + noms des applications installées, placés avant
  prompt_max_chars: 500            # taille max du prompt (Whisper en garde ~220 tokens)
  # Formes du mot d'activation retirées du texte (tout ce qui précède part aussi).
  wake_words: ["mikata", "mi kata", "micata", "mikado", "jarvis"]
llm:
  base_url: "https://opencode.ai/zen/v1"  # OpenCode Zen (compatible OpenAI)
  model: "deepseek-v4.1-flash"     # nom exact du modèle chez OpenCode Zen
  max_tool_rounds: 8
  request_timeout_s: 20
  turn_timeout_s: 60               # durée max d'une requête complète
  first_chunk_timeout_s: 8         # rien reçu en N s -> nouvelle connexion et relance
  reasoning_effort: none           # réflexion par défaut : none | low | medium | high
  reasoning_keywords:              # dit en début ou fin de commande -> niveau de réflexion
    low: ["réfléchis"]
    medium: ["réfléchis bien"]
    high: ["réfléchis à fond"]
  reasoning_fallback_steps: 2      # outil en échec ou plus de N étapes -> au moins « low »
  include_usage: true              # décompte des tokens (ligne « Tokens » du log)
  price_input_usd_per_mtok: 0.30   # DeepSeek V4.1 Flash sur OpenCode Zen, $ / million
  price_output_usd_per_mtok: 1.20
  price_cached_usd_per_mtok: 0.006
  credit_usd: 5.0                  # crédit, pour estimer ce qui reste
tools:
  timeout_s: 15                    # durée max d'un appel d'outil
  result_max_chars: 2000           # résultat d'outil renvoyé au LLM (tronqué)
  shell_timeout_s: 30              # durée max d'une commande PowerShell ou d'un script
web:
  search_provider: tavily          # tavily | brave ; clé SEARCH_API_KEY dans .env
  max_results: 5
  default_city: null               # ville de la météo si aucune n'est dite (ex. "Paris")
tts:
  backend: piper                   # piper | kokoro
  voice: models/fr_FR-siwis-medium.onnx   # voix Piper (scripts/download_models.py)
  first_chunk_min_words: 6
  kokoro_model: models/kokoro-v1.0.onnx
  kokoro_voices: models/voices-v1.0.bin
  kokoro_voice: ff_siwis           # voix française de Kokoro
  speed: 1.0                       # vitesse de parole (0.5 à 2)
  cpu_threads: 4                   # threads CPU de la synthèse (§10 : 4 max)
agent:
  follow_up_s: 6                   # fenêtre de suivi sans mot d'activation (0 = désactivée)
  follow_up_min_confidence: 0.2    # suivi : transcription moins fiable (0 à 1) -> ignorée, bip
  follow_up_use_llm_gate: true     # suivi : le LLM dit si la phrase s'adresse à MIKATA
  session_reset_min: 10
  thinking_sound_after_s: 1.2
  history_max_tokens: 6000         # historique de conversation envoyé au LLM
  history_persist: true            # historique gardé dans data/history.json (redémarrages)
  history_persist_h: 168           # ... N heures sans interaction (7 jours ; « garde la conversation un mois »)
  history_summarize: true          # plafond atteint : les plus anciens échanges sont résumés
  # Commande entière qui annule la réponse en cours ou ferme la fenêtre de suivi.
  cancel_phrases: ["stop", "arrête", "arrête-toi", "annule", "annule ça", "annule tout",
    "laisse tomber", "oublie", "oublie ça", "tais-toi", "chut", "silence", "c'est bon",
    "ça ira", "ça suffit", "c'est tout", "non", "non rien", "rien", "non merci", "pas grave"]
  # Arrêt vocal SANS « MIKATA » pendant qu'il parle : phrase entière de cette liste -> son coupé.
  voice_stop: true                 # false : seul « MIKATA » (ou Ctrl+Alt+M) coupe une réponse
  voice_stop_phrases: ["stop", "arrête", "arrête-toi", "tais-toi", "ça suffit", "chut"]
  voice_stop_silence_ms: 160       # silence qui termine la phrase d'arrêt (80 = 1 trame)
  voice_stop_max_s: 2.0            # parole plus longue : pas un arrêt, pas transcrite
guard:
  allowed_dirs: ["~"]              # dossiers où les outils fichiers ont le droit d'agir
  backup_days: 14                  # sauvegardes avant écrasement (data/backups), puis corbeille
  shutdown_cancel_s: 5             # délai pour dire « stop » avant extinction / redémarrage / veille
  confirm_after_web: false         # true : commande shell après une page web -> confirmation orale
  confirm_risky: true              # commandes risquées (registre, services...) -> « Tu confirmes ? »
  confirm_timeout_s: 6             # temps laissé pour répondre oui / non
  trash_max_mb: 4096               # au-delà, mise à la corbeille refusée (Windows supprimerait)
logging:                           # ajout phase 0 (§10 « Logs »)
  level: INFO                      # TRACE | DEBUG | INFO | SUCCESS | WARNING | ERROR
  file: data/logs/mikata.log
  rotation_mb: 5
  retention_files: 5
  stats_interval_s: 60             # ligne « CPU du processus » toutes les N s (0 = jamais)
  actions_file: data/actions.log   # journal de chaque action des outils (garde-fou)
ui:                                # ajout phase 8 : mascotte et réglages (processus à part)
  enabled: true                    # canal local vers l'interface (false : MIKATA seul, comme avant)
  mascot: true                     # lancer la mascotte au démarrage de MIKATA
  skin: default                    # dossier assets/mascot/<skin>/ ; default : Mika, dessinée en code
  bubble_s: 8                      # la bulle reste N s après la dernière phrase
