[project]
name = "mikata"
version = "0.0.1"
description = "MIKATA — assistant vocal local pour PC Windows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.12"
# Dépendances ajoutées phase par phase (docs/ARCHITECTURE.md §9 et §11).
# Les versions exactes sont épinglées dans uv.lock.
dependencies = [
    # CTranslate2 (moteur de faster-whisper) embarque cudnn64_9.dll en 9.10.2.21 : les
    # sous-bibliothèques cuDNN (paquet nvidia-cudnn-cu12, Windows) doivent avoir la même
    # version, sinon erreur au premier calcul. Changer ces deux versions ensemble.
    "ctranslate2==4.8.2",
    "faster-whisper>=1.1",
    # Client HTTP persistant du SDK OpenAI (httpx2), en HTTP/2 (§2, connexion préchauffée).
    "httpx2[http2]>=2.12",
    # TTS : Kokoro en ONNX (le paquet « kokoro » installe PyTorch), Piper (§8).
    "kokoro-onnx>=0.6",
    "loguru>=0.7.2",
    "numpy>=2.1",
    "nvidia-ml-py>=12.535",
    "onnxruntime>=1.19",
    "openai>=3.20",
    "openwakeword>=0.6",
    "pillow>=11.0",
    "piper-tts>=1.8",
    "psutil>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "send2trash>=1.8",
    "sounddevice>=0.5.1",
    "soxr>=0.5",
    # Windows uniquement (sauf pystray, multiplateforme) : importées paresseusement,
    # mockées dans les tests.
    # DLL CUDA 12 (cuBLAS, cuDNN 9) pour faster-whisper / CTranslate2 sur la RTX 3080.
    "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'win32'",
    "pynput>=1.7.7; sys_platform == 'win32'",
    # macOS : utilisé par ui/hotkeys.py et tools/input.py (PynputInput). L'exclure de la
    # CI Linux (sherpa uniquement), qui ne l'importe jamais.
    "pynput>=1.7.7; sys_platform == 'darwin'",
    # Icône de notification : commune à Windows et macOS (backend AppKit via pyobjc).
    "pystray>=0.19.5",
    "rapidfuzz>=3.9",
    "trafilatura>=2.0",
    "pyperclip>=1.9",
    # pywin32 : send2trash n'utilise sa corbeille sûre (IFileOperation, qui refuse un
    # élément non recyclable au lieu de le supprimer définitivement) qu'avec pywin32.
    "pywin32>=308 ; sys_platform == 'win32'",
    "pycaw>=20240316 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "win11toast>=0.35 ; sys_platform == 'win32'",
    # Phase 8 : interface dans un processus à part (mascotte, réglages) ; PySide6 sans les
    # modules optionnels (LGPL-3.0, liée dynamiquement). ruamel.yaml situe les clés de
    # config.yaml pour les réécrire sans perdre les commentaires ; python-dotenv pour .env.
    "pyside6-essentials>=6.7",
    "ruamel-yaml>=0.18",
    "python-dotenv>=1.0",
    # Phase 8 (skins) : détourage des images de scripts/make_skin.py (composantes connexes).
    # Déjà installé par openwakeword ; déclaré car utilisé directement.
    "scipy>=1.11",
    # Phase 12a : pilotage fin des applications par l'arbre d'accessibilité Windows (UIA).
    # Pur Python, s'appuie sur comtypes (déjà présent) ; imports paresseux, mocké dans les tests.
    "uiautomation>=2.0.25 ; sys_platform == 'win32'",
    # Phase 17e : les sessions média de Windows (SMTC), appli par appli : Pause / Reprendre
    # et titre en cours des applis tenues en arrière-plan. Même famille que winrt-runtime,
    # déjà là pour les notifications ; import paresseux, mocké dans les tests.
    "winrt-Windows.Media.Control>=3.2.1 ; sys_platform == 'win32'",
    # Phase 12b : contrôle du navigateur (Brave/Chromium) via le protocole DevTools. Le vrai
    # client est testé sur la CI Linux contre un faux serveur WebSocket.
    "websockets>=14",
    # macOS uniquement (port Option B) : ponts Objective-C importés paresseusement, mockés
    # dans les tests. La STT locale passe par MLX (Apple Silicon), le pilotage fin des
    # applis par l'API d'accessibilité, l'index de fichiers par Spotlight (rescan
    # watchdog en secours).
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Accessibility>=11; sys_platform == 'darwin'",
    "pyobjc-framework-CoreServices>=11; sys_platform == 'darwin'",
    # Corbeille sûre du Finder via l'API native (le send2trash de base reste commun).
    "send2trash[nativeLib]>=1.8; sys_platform == 'darwin'",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    # Parakeet v3 via MLX (macOS, backend STT par défaut) : langue auto-détectée (25
    # langues européennes, dont le français), import paresseux, mocké dans les tests.
    "parakeet-mlx>=0.5; sys_platform == 'darwin'",
    "macuiauto>=0.1; sys_platform == 'darwin'",
    "watchdog>=4; sys_platform == 'darwin'",
    # Linux uniquement (CI, backend STT par défaut) : Parakeet v3 en ONNX int8 sur CPU via
    # sherpa-onnx. Les poids ne sont pas dans le paquet : scripts/download_models.py les
    # précharge. Import paresseux, mocké dans les tests.
    "sherpa-onnx>=1.13; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 : license = "SPDX" (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mikata"]

[tool.uv]
# Résolution limitée aux plateformes visées : PC Windows, Mac Apple Silicon + CI Linux.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Document de référence : ses exemples de code ne sont pas reformatés.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any autorisé quand c'est voulu
    "RUF001",  # caractères « ambigus » : normaux en français
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
